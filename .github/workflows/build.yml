# Controle bij elke push: bouwt de hele app op Windows (ook de schermen/XAML) en draait de tests.
# Publiceert niets – updates voor iedereen gaan alleen via de Release-workflow.
name: Bouwcontrole

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: App bouwen (Windows, WPF)
        shell: pwsh
        run: dotnet build StreamLightControl2.csproj -c Release

      - name: Tests (kernlogica)
        continue-on-error: true
        shell: pwsh
        run: dotnet run --project Tests/StreamLightControl2.Tests.csproj -c Release

      - name: Showmaker – mp3/m4a lezen zoals de app
        shell: pwsh
        run: dotnet run --project Tests/SoundCheck/SoundCheck.csproj -c Release

      - name: Thema's – echte stijlen van de app met elk thema
        shell: pwsh
        run: |
          $fail = 0
          foreach ($t in 'standaard','kerst','herfst','zomer') {
            dotnet run --project Tests/ThemeCheck/ThemeCheck.csproj -- $t "$PWD/thema-$t.png"
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
          }
          exit $fail

      - name: Thema-plaatjes bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themas
          path: thema-*.png
          if-no-files-found: ignore
